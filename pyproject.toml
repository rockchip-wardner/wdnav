[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wdnav"
version = "0.4.0"
description = "Python bindings for Rockchip MPP / RGA2 / V4L2: hardware video decode and 2D acceleration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "wdnav maintainers"},
]
keywords = ["wdnav", "rockchip", "mpp", "rga", "video", "decoder", "v4l2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
# 第三方 Python 依赖。VideoCapture / VideoWriter 路径（av/numpy/v4l2）
# 只会在显式 import wdnav.video / wdnav.encoder 时触发；纯 import wdnav 不会强制装这些。
#
# PyAV: wdnav.encoder.VideoWriter 强依赖
#   * ``Container.add_mux_stream(codec_name, **kwargs)`` — "pre-encoded
#     packet" 入口；
#   * matroska muxer 自动跑的 ``extract_extradata`` BSF（从首 packet NAL 流
#     抽 SPS/PPS 写到 codecpar.extradata）。
# 这两个功能由 PyAV PR #2305 引入（commit 5b48f2d，2026-06-14 merge 到 main）。
# PyPI 上最新 wheel 是 18.0.0，**不包含此修复**，安装后 VideoWriter 会写
# 默认 1280×720 High avcC，decoder 拒绝解码。
# 在 PyAV 发布 ≥19 wheel 之前，请按 README “Building from source” 一节
# 装主分支的 PyAV：
#   pip install av @ https://github.com/PyAV-Org/PyAV/archive/main.tar.gz
# 其他系统（v4l2 / numpy）行为不变。
dependencies = [
    "av>=11.0.dev0; sys_platform == 'linux'",
    "av>=10.0; sys_platform != 'linux'",
    "numpy>=1.20",
    "v4l2>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "build>=0.10",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://example.com/wdnav"
Issues = "https://example.com/wdnav/issues"

# ---------------------------------------------------------------------------
# setuptools 配置：纯 Python 包 + 两个 C shim
# (``src/wdnav/cshim_video_encoder.c`` + ``src/wdnav/cshim_video_decoder.c``)
# 编译产物 (``src/wdnav/lib/libshim_video.so``) 由 ``build_rkv.py`` 在 wheel
# 打包之前自动编译出来，libshim_video.so 随 wheel 一起发布；native 上游
# 库（librockchip_mpp）**不**随 wheel 发布，必须由用户在系统层面安装，
# shim 通过 dlopen 加载它。
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["wdnav*"]

[tool.setuptools.package-data]
wdnav = [
    "py.typed",
    "lib/libshim_video.so",
]

[tool.setuptools.exclude-package-data]
wdnav = [
    "*.c",
    "*.so.bak",
]

# Custom build_py subclass that compiles the C shim before Python
# packaging. See ``build_rkv.py`` at the project root for the full
# rationale (why a top-level module, why a manual subprocess instead
# of ``Extension`` / ``build_ext``, and why the output lands inside
# ``src/wdnav/lib/`` rather than ``build/``).
#
# The cmdclass value is a ``module.ClassName`` dotted identifier, NOT
# the more familiar ``module:ClassName`` form — setuptools' pyproject
# schema uses the dotted form (`python-qualified-identifier` format)
# and rejects the colon form.
[tool.setuptools.cmdclass]
build_py = "wdnav._build_wdnav.build_py"

# ---------------------------------------------------------------------------
# 常用工具配置
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.build]
wheel = true
