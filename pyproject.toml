[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrkv"
version = "0.1.0"
description = "Python toolkit for the rkv key-value store and Rockchip MPP/RGA video decoder"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "pyrkv maintainers"},
]
keywords = ["rkv", "key-value", "storage", "rockchip", "mpp", "rga", "video", "decoder"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Multimedia :: Video",
]
# 第三方 Python 依赖。VideoCapture 路径（av/cv2/numpy/v4l2）只会在显式
# import rkv.video 时触发；纯 KV 用户（只用 Rkv）不会强制装这些。
dependencies = [
    "av>=10.0",
    "opencv-python>=4.5",
    "numpy>=1.20",
    "v4l2>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "build>=0.10",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://example.com/pyrkv"
Issues = "https://example.com/pyrkv/issues"

# ---------------------------------------------------------------------------
# setuptools 配置：纯 Python 包。native 库（librkv / librockchip_mpp /
# librga）**不**随 wheel 发布，必须由用户在系统层面安装，由 ctypes 通过
# ldconfig / /usr/lib/... 加载。
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rkv*"]

[tool.setuptools.package-data]
rkv = [
    "py.typed",
]

# ---------------------------------------------------------------------------
# 常用工具配置
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.build]
wheel = true