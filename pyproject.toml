[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rkv"
version = "0.2.0"
description = "Python bindings for Rockchip MPP / RGA2 / V4L2: hardware video decode and 2D acceleration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "pyrkv maintainers"},
]
keywords = ["rkv", "rockchip", "mpp", "rga", "video", "decoder", "v4l2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
# 第三方 Python 依赖。VideoCapture / VideoWriter 路径（av/numpy/v4l2）
# 只会在显式 import rkv.video / rkv.encoder 时触发；纯 import rkv 不会强制装这些。
#
# PyAV: rkv.encoder.VideoWriter 强依赖
#   * ``Container.add_mux_stream(codec_name, **kwargs)`` — "pre-encoded
#     packet" 入口；
#   * matroska muxer 自动跑的 ``extract_extradata`` BSF（从首 packet NAL 流
#     抽 SPS/PPS 写到 codecpar.extradata）。
# 这两个功能由 PyAV PR #2305 引入（commit 5b48f2d，2026-06-14 merge 到 main）。
# PyPI 上最新 wheel 是 18.0.0，**不包含此修复**，安装后 VideoWriter 会写
# 默认 1280×720 High avcC，decoder 拒绝解码。
# 在 PyAV 发布 ≥19 wheel 之前，请按 README “Building from source” 一节
# 装主分支的 PyAV：
#   pip install av @ https://github.com/PyAV-Org/PyAV/archive/main.tar.gz
# 其他系统（v4l2 / numpy）行为不变。
dependencies = [
    "av>=11.0.dev0; sys_platform == 'linux'",
    "av>=10.0; sys_platform != 'linux'",
    "numpy>=1.20",
    "v4l2>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "build>=0.10",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://example.com/pyrkv"
Issues = "https://example.com/pyrkv/issues"

# ---------------------------------------------------------------------------
# setuptools 配置：纯 Python 包。native 库（librockchip_mpp / librga）
# **不**随 wheel 发布，必须由用户在系统层面安装，由 ctypes 通过
# ldconfig / /usr/lib/... 加载。
# ---------------------------------------------------------------------------
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rkv*"]

[tool.setuptools.package-data]
rkv = [
    "py.typed",
]

# ---------------------------------------------------------------------------
# 常用工具配置
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.build]
wheel = true
